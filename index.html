<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fama Burguer e Pizzaria</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Cardápio digital da Fama Burguer e Pizzaria — Manhuaçu, MG. Lanches, pizzas, à la carte, bebidas, porções, açaí e mais.">
<meta name="theme-color" content="#0f0b08">
<!-- Remova a linha abaixo quando o dono aprovar e quiser aparecer no Google -->
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/logo-fama.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/css/fama.css">
<link rel="preload" as="image" href="assets/hero/f001.webp">
</head>
<body class="is-intro">

<!-- ====== Carregamento ====== -->
<div class="loader" id="loader" aria-hidden="true">
  <img class="loader__logo" src="assets/img/logo-fama.png" alt="" width="200" height="200">
  <div class="loader__bar"><span id="loaderBar"></span></div>
  <p class="loader__txt" id="loaderTxt">Acendendo a chapa…</p>
</div>

<!-- ====== Barra superior ====== -->
<header class="topbar" id="topbar">
  <a class="topbar__brand" href="#inicio" data-scroll="#inicio" aria-label="Fama Burguer e Pizzaria — início">
    <img src="assets/img/logo-fama.png" alt="Logo Fama Burguer" width="44" height="44">
    <span class="topbar__name">Fama Burguer <em>e Pizzaria</em></span>
  </a>
  <span class="status-pill" id="statusPill" data-state="loading"><i></i><span>…</span></span>
  <div class="topbar__actions">
    <button class="icon-btn" id="skipIntro" type="button">Pular abertura</button>
    <button class="icon-btn icon-btn--round" id="openSearch" type="button" aria-label="Buscar no cardápio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
    </button>
    <button class="cart-btn" id="openCart" type="button" aria-label="Abrir carrinho">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6.2"/><circle cx="10" cy="20.5" r="1.3"/><circle cx="17" cy="20.5" r="1.3"/></svg>
      <span class="cart-btn__total" id="cartBtnTotal">R$ 0,00</span>
      <b class="cart-btn__count" id="cartCount" hidden>0</b>
    </button>
  </div>
</header>

<canvas id="fx" class="fx" aria-hidden="true"></canvas>
<div class="floaters" id="floaters" aria-hidden="true"></div>

<main id="inicio">
  <!-- ====== Abertura cinematográfica ====== -->
  <section class="hero" id="hero" aria-label="Abertura: montagem do hambúrguer">
    <div class="hero__stage">
      <div class="hero__glow" aria-hidden="true"></div>
      <div class="hero__cam" id="heroCam">
        <canvas class="hero__frames" id="frames" width="478" height="796" aria-hidden="true"></canvas>
        <video class="hero__video" id="heroVideo" muted playsinline preload="none" poster="assets/hero/f151.webp" hidden>
          <source src="assets/hero/montagem.mp4" type="video/mp4">
        </video>
        <div class="hero__sweep" id="heroSweep" aria-hidden="true"></div>
      </div>
      <div class="hero__vignette" aria-hidden="true"></div>

      <div class="hero__intro" id="heroIntro">
        <img class="hero__badge" src="assets/img/logo-fama.png" alt="Logo Fama Burguer" width="200" height="200">
        <h1 class="hero__title"><span>Fama Burguer</span><span>e Pizzaria</span></h1>
        <p class="hero__segments" id="heroSegments"></p>
        <p class="hero__cue"><span class="hero__mouse" aria-hidden="true"></span>Role para montar o burger</p>
      </div>

      <div class="hero__finale" id="heroFinale">
        <img class="hero__badge hero__badge--sm" src="assets/img/logo-fama.png" alt="" width="200" height="200">
        <p class="hero__kicker">Manhuaçu · MG</p>
        <h2 class="hero__big">Fama Burguer<br><span>e Pizzaria</span></h2>
        <div class="hero__ctas">
          <a class="btn btn--mustard" href="#cardapio" data-scroll="#cardapio">Ver o cardápio</a>
          <a class="btn btn--ghost" id="heroWhats" href="#" target="_blank" rel="noopener">Pedir pelo WhatsApp</a>
        </div>
      </div>
      <button class="hero__replay" id="heroReplay" type="button" hidden>Assistir montagem</button>
    </div>
  </section>

  <!-- ====== Calda de ketchup (transição) ====== -->
  <div class="sauce" id="sauce" aria-hidden="true">
    <svg class="sauce__svg" viewBox="0 0 1440 320" preserveAspectRatio="xMidYMin slice">
      <defs>
        <linearGradient id="sauceGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#5e0703"/>
          <stop offset=".5" stop-color="#8f0f07"/>
          <stop offset="1" stop-color="#a8160b"/>
        </linearGradient>
        <!-- ketchup com volume: relevo pela borda + luz difusa + brilho molhado -->
        <filter id="ketchupGloss" x="-10%" y="-10%" width="120%" height="130%" color-interpolation-filters="sRGB">
          <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="h"/>
          <feDiffuseLighting in="h" surfaceScale="7" diffuseConstant="1.05" lighting-color="#ffffff" result="d">
            <feDistantLight azimuth="235" elevation="52"/>
          </feDiffuseLighting>
          <feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1.15" k2="0" k3="0" k4="0" result="shaded"/>
          <feSpecularLighting in="h" surfaceScale="7" specularConstant="1.2" specularExponent="42" lighting-color="#ffe9e2" result="s">
            <fePointLight x="380" y="-260" z="260"/>
          </feSpecularLighting>
          <feComposite in="s" in2="SourceAlpha" operator="in" result="sIn"/>
          <feComposite in="shaded" in2="sIn" operator="arithmetic" k1="0" k2="1" k3=".85" k4="0" result="lit"/>
          <feComposite in="lit" in2="SourceAlpha" operator="in"/>
        </filter>
        <filter id="ketchupGlossSm" x="-10%" y="-20%" width="120%" height="160%" color-interpolation-filters="sRGB">
          <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="h"/>
          <feDiffuseLighting in="h" surfaceScale="4" diffuseConstant="1.05" lighting-color="#ffffff" result="d"><feDistantLight azimuth="235" elevation="52"/></feDiffuseLighting>
          <feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1.15" k2="0" k3="0" k4="0" result="shaded"/>
          <feSpecularLighting in="h" surfaceScale="4" specularConstant="1.1" specularExponent="38" lighting-color="#ffe9e2" result="s"><fePointLight x="20" y="-40" z="60"/></feSpecularLighting>
          <feComposite in="s" in2="SourceAlpha" operator="in" result="sIn"/>
          <feComposite in="shaded" in2="sIn" operator="arithmetic" k1="0" k2="1" k3=".8" k4="0" result="lit"/>
          <feComposite in="lit" in2="SourceAlpha" operator="in"/>
        </filter>
        <linearGradient id="sauceShine" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#fff" stop-opacity="0"/>
          <stop offset=".5" stop-color="#ffd6c9" stop-opacity=".55"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <g id="drips" filter="url(#ketchupGloss)"></g>
    </svg>
  </div>

  <!-- ====== Informações rápidas ====== -->
  <section class="facts" id="cardapio" aria-label="Informações da loja">
    <div class="wrap"><div class="facts__row" id="facts"></div></div>
  </section>

  <!-- ====== Destaques ====== -->
  <section class="highlights" aria-labelledby="hlTitle">
    <div class="wrap">
      <h2 class="sec-title" id="hlTitle">Destaques</h2>
    </div>
    <div class="hl-track" id="highlights" data-lenis-prevent-touch></div>
  </section>

  <!-- ====== Navegação fixa por categorias ====== -->
  <nav class="catnav" id="catnav" aria-label="Categorias do cardápio">
    <div class="catnav__inner" id="catnavInner" data-lenis-prevent-touch></div>
  </nav>

  <!-- ====== Catálogo ====== -->
  <div class="catalog" id="catalog"></div>

  <!-- ====== Rodapé / informações ====== -->
  <footer class="foot" id="info">
    <div class="wrap foot__grid" id="footer"></div>
    <div class="wrap foot__legal">
      <p id="sourceNote"></p>
      <button class="link-btn" id="toggleLite" type="button"></button>
    </div>
  </footer>
</main>

<!-- ====== Modal de produto ====== -->
<div class="sheet" id="productSheet" role="dialog" aria-modal="true" aria-labelledby="pTitle" hidden>
  <div class="sheet__scrim" data-close></div>
  <div class="sheet__panel" data-lenis-prevent>
    <button class="sheet__close" type="button" data-close aria-label="Fechar">×</button>
    <div class="pd" id="productBody"></div>
  </div>
</div>

<!-- ====== Carrinho ====== -->
<div class="drawer" id="cartDrawer" role="dialog" aria-modal="true" aria-labelledby="cartTitle" hidden>
  <div class="sheet__scrim" data-close></div>
  <aside class="drawer__panel" data-lenis-prevent>
    <div class="drawer__head">
      <h2 id="cartTitle">Seu pedido</h2>
      <button class="sheet__close sheet__close--static" type="button" data-close aria-label="Fechar">×</button>
    </div>
    <div class="drawer__body" id="cartBody"></div>
  </aside>
</div>

<!-- ====== Busca ====== -->
<div class="search" id="searchLayer" role="dialog" aria-modal="true" aria-label="Buscar no cardápio" hidden>
  <div class="sheet__scrim" data-close></div>
  <div class="search__panel" data-lenis-prevent>
    <div class="search__bar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
      <input id="searchInput" type="search" placeholder="Busque X-Tudo, pizza, coca, açaí…" autocomplete="off" aria-label="Buscar produto">
      <button class="link-btn" type="button" data-close>Fechar</button>
    </div>
    <div class="search__results" id="searchResults"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="assets/vendor/gsap.min.js"></script>
<script src="assets/vendor/ScrollTrigger.min.js"></script>
<script src="assets/vendor/lenis.min.js"></script>
<script src="assets/js/fonte-dados.js"></script>
<script src="assets/js/app.js"></script>
<script>
  /* busca o cardápio (Supabase ou cópia de reserva) e depois monta o site */
  FamaDados.carregar(function (origem) {
    document.documentElement.dataset.fonte = origem;
    if (window.FAMA_DATA) window.iniciarFama();
    else document.getElementById('loaderTxt').textContent = 'Não foi possível carregar o cardápio. Recarregue a página.';
  });
</script>
</body>
</html>
